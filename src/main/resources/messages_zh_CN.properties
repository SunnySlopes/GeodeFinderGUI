hint.fullSearch=完整搜索：所有达到晶洞阈值的簇都会做精确芽计算。
hint.structureOnly=仅计算结构数：只统计每个加载窗口里的晶洞个数，不计算紫水晶芽方块。<br>结果没有芽数，速度最快。
hint.fastSearch=快速搜索：先用晶洞数乘经验平均数 36 估计哪些簇可能达到芽阈值<br>再只对这些热点的加载范围做精确芽计算。<br>可能漏掉晶洞较少、但单洞芽很多的簇。
hint.outputHint=结果坐标是区块中心的方块坐标，/tp 中的 Y=64 只作传送高度。

